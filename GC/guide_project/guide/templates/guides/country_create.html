{% extends 'guide/base.html' %}
{% load static %}

{% block title %}ГПС - Страны{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card">
        <div class="card-header">
            <h4>{{ title }}</h4>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        
                    </div>
                {% endfor %}
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="{% url 'guide:home' %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>  
    </div>
</div>
{% endblock %}
