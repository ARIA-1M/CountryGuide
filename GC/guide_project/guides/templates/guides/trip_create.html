{% extends 'guides/base.html' %}
{% load static %}

{% block title %}ГПС - Создание поездки{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card">
        <div class="card-header">
            <h4>{{ title }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Страна</label>
                    {{ form.country }}
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Дата начала</label>
                            {{ form.start_date }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Дата окончания</label>
                            {{ form.end_date }}
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Общий бюджет</label>
                            {{ form.amount }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Лимит на день</label>
                            {{ form.daily_limit }}
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Пороговые уведомления {{ form.threshold_limit }}</label>
                          
                        </div>
                    </div>
                </div>
                
                <div class="alert alert-info" id="budgetInfo" style="display: none;"></div>
                
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="{% url 'guides:home' %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>  
    </div>
</div>
{% endblock %}
