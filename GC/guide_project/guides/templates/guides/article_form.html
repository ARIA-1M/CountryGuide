<!DOCTYPE html>
<html>
<head>
    <title>{% if mode == 'create' %}Добавить{% else %}Редактировать{% endif %} статью</title>
</head>
<body>
    <h1>{% if mode == 'create' %}Добавить статью{% else %}Редактировать статью{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        <label>Страна:</label>
        <select name="country_id" required>
            {% for country in countries %}
                <option value="{{ country.id }}" {% if article and article.country.id == country.id %}selected{% endif %}>
                    {{ country.name }}
                </option>
            {% endfor %}
        </select><br>
        <label>Заголовок:</label>
        <input type="text" name="title" value="{{ article.title|default:'' }}" required><br>
        <label>Ссылка:</label>
        <input type="url" name="link" value="{{ article.link|default:'' }}" required><br>
        <button type="submit">Сохранить</button>
        <a href="{% url 'guides:articles_list' %}">Отмена</a>
    </form>
</body>
</html>
