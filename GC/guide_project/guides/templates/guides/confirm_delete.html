{% extends 'guides/base.html' %}
{% load static %}

{% block title %}ГПС - Удаление {{ type }}{% endblock %}

{% block content %}
<div class="container-py-4">
    <div class="card">
        <div class="card-header">
            <h4>Подтверждение удаления</h4>
        </div>
        <div class="card-body">
            <p>Вы уверены, что хотите удалить {{ type }} <strong>"{{ object }}"</strong>?</p>
            <p style="color: red; margin-top: 10px;">Это действие нельзя отменить!</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mt-3">
                    <button type="submit" class="btn-danger">Да, удалить</button>
                    <a href="javascript:history.back()" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
