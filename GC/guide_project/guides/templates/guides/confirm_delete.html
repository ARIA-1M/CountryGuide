<!DOCTYPE html>
<html>
<head>
    <title>Удалить {{ type }}</title>
</head>
<body>
    <h1>Удалить {{ type }}?</h1>
    <p>Вы уверены, что хотите удалить "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="javascript:history.back()">Отмена</a>
    </form>
</body>
</html>
